[package]
name = "mmdc-fmt"
version = "0.3.0"
edition = "2024"
build = "src/build.rs"

[dependencies]
clap = { version = "4.5.37", features = ["derive", "string", "cargo"] }
regex = "1.11.1"
strum = { version = "0.27.1", features = ["derive"] }
strum_macros = "0.27.1"

[dev-dependencies]
assert_cmd = "2.0.17"
assert_fs = "1.1.3"
indoc = "2.0.6"

[build-dependencies]
vergen-gitcl = { version = "1.0.8", features = ["rustc"] }
